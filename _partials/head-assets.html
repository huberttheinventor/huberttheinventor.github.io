<!-- Without JavaScript the ported CSS leaves every [data-splitting] element at
     opacity 0, because the reveal is animated. Show it all instead. -->
<noscript><style>
  .hover_effect, .splitting, [data-splitting],
  section .banner__hero, section .banner__hero [data-splitting],
  .homeMiniVideo video { opacity: 1 !important; }
</style></noscript>
<script>
/* Reading plate. Set before first paint so the page never flashes the other
   plate. Default is "paper" (R2); "panel" (R3) is the reader's choice and is
   remembered in localStorage under hubert:reading — disclosed in privacy.html. */
(function () {
  var el = document.documentElement, k = "hubert:reading", v = "paper";
  try { var s = localStorage.getItem(k); if (s === "paper" || s === "panel") v = s; } catch (e) {}
  el.setAttribute("data-reading", v);
  el.classList.add("reading-ready");
  addEventListener("DOMContentLoaded", function () {
    var g = document.querySelector("[data-reading-toggle]");
    if (!g) return;
    var bs = g.querySelectorAll("button[data-reading]");
    function sync() {
      var c = el.getAttribute("data-reading");
      bs.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.reading === c)); });
    }
    bs.forEach(function (b) {
      b.addEventListener("click", function () {
        el.setAttribute("data-reading", b.dataset.reading);
        try { localStorage.setItem(k, b.dataset.reading); } catch (e) {}
        sync();
      });
    });
    sync();
  });
})();
</script>
