<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="System map: one audio file goes in, every word in it is timestamped, the scenes are built on those timings across motion, sound and caption tracks, and a headless Chrome draws all 2,232 frames of the resulting web page out to an MP4. There is no video engine in the chain.">
  <rect width="1200" height="480" fill="#12161a"/>
  <style>.m-line{stroke:#7a8990;stroke-width:1.2;fill:none}.m-edge{stroke:#79b0cc;stroke-width:1.6;fill:none}.m-video{stroke:#79b0cc;stroke-width:2.4;fill:none;stroke-linecap:round}.m-meta{stroke:#7a8990;stroke-width:1.6;fill:none;stroke-dasharray:7 6}.m-box{stroke:#79b0cc;stroke-width:1.4;fill:none}.m-fill{fill:#79b0cc}.m-dim{fill:#79b0cc7d}.m-t{font-family:Mono,ui-monospace,monospace;font-size:13px;letter-spacing:1.1px;fill:#abbac2}.m-n{font-family:Mono,ui-monospace,monospace;font-size:14px;font-weight:500;letter-spacing:.7px;fill:#faf6af}</style>
  <text class="m-n" x="20" y="60">01</text>
    <text class="m-t" x="60" y="60">YOUR AUDIO &middot; ONE FILE, NOTHING ELSE</text>
