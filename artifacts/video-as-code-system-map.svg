<rect class="m-dim" x="744.5" y="262" width="17.0" height="14" rx="2"/><rect class="m-dim" x="765.5" y="262" width="19.1" height="14" rx="2"/><rect class="m-dim" x="788.6" y="262" width="21.2" height="14" rx="2"/><rect class="m-dim" x="813.8" y="262" width="19.1" height="14" rx="2"/><rect class="m-dim" x="836.9" y="262" width="19.1" height="14" rx="2"/><text class="m-t" x="650" y="320">AN HTML FILE. THAT IS THE WHOLE FORMAT.</text><text class="m-n" x="950" y="60">04</text>
    <text class="m-t" x="990" y="60">A BROWSER DRAWS EVERY FRAME</text>
    <path class="m-box" d="M960 150 L1180 150 L1180 268 L960 268 Z"/>
    <path class="m-line" d="M960 176 L1180 176"/>
    <circle class="m-fill" cx="974" cy="163" r="4"/><circle class="m-fill" cx="990" cy="163" r="4"/>
    <text class="m-t" x="1006" y="168">HEADLESS CHROME</text><rect class="m-box" x="966" y="196" width="28" height="52" rx="2"/><rect class="m-box" x="1002" y="196" width="28" height="52" rx="2"/><rect class="m-box" x="1038" y="196" width="28" height="52" rx="2"/><rect class="m-box" x="1074" y="196" width="28" height="52" rx="2"/><rect class="m-box" x="1110" y="196" width="28" height="52" rx="2"/><rect class="m-box" x="1146" y="196" width="28" height="52" rx="2"/><text class="m-t" x="960" y="300">2,232 FRAMES &rarr; MP4</text><path class="m-meta" d="M266 220 L322 220"/>
    <path class="m-meta" d="M576 220 L632 220"/>
    <path class="m-meta" d="M876 220 L944 220"/>
    <text class="m-t" x="20" y="430">NO VIDEO ENGINE ANYWHERE IN THIS CHAIN. THE COMPOSITION IS A WEB PAGE, AND WHAT A BROWSER CAN PAINT, THE VIDEO CAN HAVE.</text>
</svg>