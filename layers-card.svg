<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-labelledby="layer-card-file-t layer-card-file-d" id="layer-card-file" class="layer-card">
<title id="layer-card-file-t">LAYERS: the eight layers of a company AI</title>
<desc id="layer-card-file-d">A stack of eight layers around a model, each with the one failure it fixes, for the example assistant Bolt at the example delivery company Swiftbox. 1 Model. 2 System prompt. 3 RAG. 4 Tools via MCP. 5 Access, with OAuth. 6 Guardrails. 7 Cache and router. 8 Observability, with evals. Rule: never edit the system prompt without running the evals. Story figures are illustrative.</desc>
<defs><style>@font-face{font-family:Mono;src:url('assets/fonts/PPNeueMontrealMono-Book.D9DlBA0F.woff2') format('woff2')}@font-face{font-family:SemiSqueezed;src:url('assets/fonts/SemiSqueezedMedium.DVwdXl-1.woff2') format('woff2')}#layer-card-file text{font-family:Mono,ui-monospace,monospace;fill:#e9ebed;font-size:21px}#layer-card-file .title{font-family:SemiSqueezed,sans-serif;font-size:72px}#layer-card-file .name{font-family:SemiSqueezed,sans-serif;font-size:34px;letter-spacing:.01em}#layer-card-file .num{font-size:22px;fill:#8d9397;letter-spacing:.08em}#layer-card-file .small{font-size:16px;fill:#8d9397;letter-spacing:.06em}#layer-card-file .foot{font-size:20px;fill:#8d9397;letter-spacing:.02em}#layer-card-file .fix{font-size:20px;fill:#e9ebed;opacity:.88}#layer-card-file .rule{font-family:SemiSqueezed,sans-serif;font-size:36px;fill:#0a0b0c}</style><radialGradient id="layer-card-file-bgg" cx="50%" cy="22%" r="75%"><stop offset="0" stop-color="#181b1e"/><stop offset="1" stop-color="#090a0b"/></radialGradient><radialGradient id="bodyg" cx="36%" cy="28%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#d9dde2"/><stop offset="1" stop-color="#7d858e"/></radialGradient><linearGradient id="rowg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2024"/><stop offset="1" stop-color="#111315"/></linearGradient></defs>
<rect width="1080" height="1350" fill="url(#layer-card-file-bgg)"/>
<text x="64" y="76" class="small">FIELD CARD · LAYERS · @HUBERTTHEINVENTOR</text>
<text x="64" y="156" class="title">Your own AI</text>
<text x="64" y="224" class="title">is eight layers.</text>
<text x="64" y="262" class="small">EXAMPLE: BOLT AT SWIFTBOX. EACH LAYER ADDED AFTER SOMETHING BROKE.</text>
<g transform="translate(800 62) scale(1.0)">
<ellipse cx="100" cy="112" rx="70" ry="9" fill="#000" opacity=".5"/>
<ellipse cx="100" cy="56" rx="86" ry="56" fill="url(#bodyg)" stroke="#2a2f34" stroke-width="2"/>
<ellipse cx="62" cy="22" rx="28" ry="10" fill="#fff" opacity=".35" transform="rotate(-20 62 22)"/>
<circle cx="14" cy="56" r="13" fill="url(#bodyg)"/><circle cx="186" cy="56" r="13" fill="url(#bodyg)"/>
<circle cx="14" cy="56" r="6" fill="none" stroke="#01ea0d" stroke-width="2"/><circle cx="186" cy="56" r="6" fill="none" stroke="#01ea0d" stroke-width="2"/>
<path d="M36 46 C36 26 56 22 100 22 C144 22 164 26 164 46 L164 74 C164 94 144 98 100 98 C56 98 36 94 36 74 Z" fill="#06080a" stroke="#000" stroke-width="2"/>
<ellipse cx="72" cy="64" rx="9" ry="12" fill="#7ef0ff"/><ellipse cx="128" cy="64" rx="9" ry="12" fill="#7ef0ff"/>
<ellipse cx="69" cy="59" rx="3" ry="3.5" fill="#fff" opacity=".9"/><ellipse cx="125" cy="59" rx="3" ry="3.5" fill="#fff" opacity=".9"/>
<path d="M86 84 Q100 92 114 84" stroke="#7ef0ff" stroke-width="3" fill="none" stroke-linecap="round"/>
<ellipse cx="100" cy="2" rx="22" ry="5" fill="none" stroke="#01ea0d" stroke-width="3"/>
</g>
<rect x="64" y="286" width="952" height="106" rx="18" fill="url(#rowg)" stroke="#2e3337" stroke-width="2"/>
<rect x="64" y="286" width="8" height="106" rx="4" fill="#01ea0d"/>
<text x="96" y="330" class="num">08</text>
<text x="152" y="332" class="name">OBSERVABILITY</text>
<text x="152" y="358" class="fix">Bolt gets one wrong and nobody knows if it was the</text>
<text x="152" y="381" class="fix">prompt, document or tool. Trace it; evals run on every change.</text>
<rect x="64" y="400" width="952" height="106" rx="18" fill="url(#rowg)" stroke="#2e3337" stroke-width="2"/>
<rect x="64" y="400" width="8" height="106" rx="4" fill="#01ea0d"/>
<text x="96" y="444" class="num">07</text>
<text x="152" y="446" class="name">CACHE &amp; ROUTER</text>
<text x="152" y="472" class="fix">Monday, 2,000 people ask at once and the token bill explodes.</text>
<text x="152" y="495" class="fix">Cache exact repeats; route some questions to a cheaper model.</text>
<rect x="64" y="514" width="952" height="106" rx="18" fill="url(#rowg)" stroke="#2e3337" stroke-width="2"/>
<rect x="64" y="514" width="8" height="106" rx="4" fill="#01ea0d"/>
<text x="96" y="558" class="num">06</text>
<text x="152" y="560" class="name">GUARDRAILS</text>
<text x="152" y="586" class="fix">A hidden line in an email says ignore your rules and</text>
<text x="152" y="609" class="fix">refund everything (prompt injection). Screen, flag, mask PII.</text>
<rect x="64" y="628" width="952" height="106" rx="18" fill="url(#rowg)" stroke="#2e3337" stroke-width="2"/>
<rect x="64" y="628" width="8" height="106" rx="4" fill="#01ea0d"/>
<text x="96" y="672" class="num">05</text>
<text x="152" y="674" class="name">ACCESS</text>
<text x="152" y="700" class="fix">A new hire asks a manager&#x27;s salary and Bolt reads it out.</text>
<text x="152" y="723" class="fix">Each tool call carries limited access on behalf of the person asking.</text>
<rect x="64" y="742" width="952" height="106" rx="18" fill="url(#rowg)" stroke="#2e3337" stroke-width="2"/>
<rect x="64" y="742" width="8" height="106" rx="4" fill="#01ea0d"/>
<text x="96" y="786" class="num">04</text>
<text x="152" y="788" class="name">TOOLS (MCP)</text>
<text x="152" y="814" class="fix">Customers want actions (refund, ticket, Slack),</text>
<text x="152" y="837" class="fix">not only words.</text>
<rect x="64" y="856" width="952" height="106" rx="18" fill="url(#rowg)" stroke="#2e3337" stroke-width="2"/>
<rect x="64" y="856" width="8" height="106" rx="4" fill="#01ea0d"/>
<text x="96" y="900" class="num">03</text>
<text x="152" y="902" class="name">RAG</text>
<text x="152" y="928" class="fix">Bolt has read none of the company documents and</text>
<text x="152" y="951" class="fix">makes up a refund limit ($500 said, $50 real).</text>
<rect x="64" y="970" width="952" height="106" rx="18" fill="url(#rowg)" stroke="#2e3337" stroke-width="2"/>
<rect x="64" y="970" width="8" height="106" rx="4" fill="#01ea0d"/>
<text x="96" y="1014" class="num">02</text>
<text x="152" y="1016" class="name">SYSTEM PROMPT</text>
<text x="152" y="1042" class="fix">Bolt has no brand voice and is not told to stay</text>
<text x="152" y="1065" class="fix">on topic or never to recommend a competitor.</text>
<rect x="64" y="1084" width="952" height="106" rx="18" fill="url(#rowg)" stroke="#2e3337" stroke-width="2"/>
<rect x="64" y="1084" width="8" height="106" rx="4" fill="#01ea0d"/>
<text x="96" y="1128" class="num">01</text>
<text x="152" y="1130" class="name">MODEL</text>
<text x="152" y="1156" class="fix">A logo on a model is not an assistant: first</text>
<text x="152" y="1179" class="fix">customer asks, Bolt recommends the competitor.</text>
<rect x="64" y="1204" width="952" height="64" rx="16" fill="#01ea0d"/>
<text x="540.0" y="1247" text-anchor="middle" class="rule">Never edit the system prompt without running the evals.</text>
<text x="64" y="1292" class="foot">BOLT AT SWIFTBOX IS FICTIONAL; FIGURES ARE EXAMPLES.</text>
<text x="64" y="1318" class="foot">ONE COMMON STACK, NOT THE ONLY DESIGN. SOURCES: SEE LAYERS PAGE.</text>
</svg>
